<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diligent AI — What&rsquo;s on your plate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Design tokens — resolved from the Figma variable collection
   (file: AI chat box ideation, node 80977:42583 "Cards A")
   ============================================================ */
:root{
  /* surface */
  --surface-default:#ffffff;
  --surface-variant-subtle:#f9f9fc;

  /* Semantic/Shadow/Elevation/Low */
  --elev-low-1:#87878714;
  --elev-low-2:#8787870f;
  --elev-low-3:#87878705;
  --elev-low-4:#87878703;
  --shadow-elevation-low:
      -1px   4px  8px 0 var(--elev-low-1),
      -2px   9px 12px 0 var(--elev-low-2),
      -12px 38px 24px 0 var(--elev-low-3),
      -12px 40px 20px 0 var(--elev-low-4);

  /* outline / divider */
  --outline-static:#dee0e9;
  --outline-default:#888b9a;        /* composer border — all states (XDS-5739) */
  --outline-disabled:#888b9a;       /* composer border — default   */
  --outline-highlighted:#888b9a;    /* composer border — proximity */
  --card-outline:#dee0e9;           /* Action/Secondary/Outline disabled */
  --tile-outline:#dee0e9;           /* Outline/Static */
  --secondary-hover:#eeeff5;        /* Action/Secondary/Hover  */
  --secondary-active:#dee0e9;       /* Action/Secondary/Active */
  --divider-default:#dee0e9;
  --secondary-outline-disabled:#dee0e9;

  /* type */
  --type-default:#1e1e1e;
  --type-muted:#575a67;
  --on-secondary:#232429;

  /* action */
  --nav-selected-bg:#ecf0ff;
  --nav-on-selected:#0040d5;
  --nav-indicator:#0040d5;
  --link-default:#1c4ee4;
  --primary-disabled:#dee0e9;
  --on-primary-disabled:#a5a7b3;
  --primary-active-start:#002e9f;   /* Gradient primary active */
  --primary-active-end:#002585;
  --on-primary:#ffffff;

  /* proximity / focus motion */
  --glow-x:0px;                     /* driven by rAF loop */
  --glow-y:0px;
  --glow-boost:0;                   /* 0 = resting, 1 = cursor at the input */
  --glow-a-scale:1;                 /* 0.7924 when focused (Figma: 729.75/921) */
  --ease-soft:cubic-bezier(.22,.61,.36,1);

  /* accent */
  --indigo-35:#0040d5;
  --indigo-50:#4069fe;
  --indigo-90:#dde1ff;
  --indigo-95:#efefff;
  --lavender-50:#7f76ec;
  --primary-grad-start:#4069fe;     /* Gradient primary default */
  --primary-grad-end:#1c4ee4;

  --bg-gradient-start:#f9f9fc;      /* Background/Base gradient start */
  --bg-gradient-end:#fcfcff;        /* Background/Base gradient end   */

  /* radius */
  --radius-md:8px;
  --radius-lg:12px;
  --radius-full:9999px;


  /* metrics */
  --sidenav-width:300px;
  --topbar-height:64px;
  --icon-lg:24px;
  --icon-md:20px;
  --content-max:1140px;   /* 980 column + 2 x 80 gutter, as in Figma */
  --content-pad:80px;
}

/* ============================================================
   Reset
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--surface-default);
  color:var(--type-default);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}

/* icon helper — Material Symbols geometry, inlined as SVG */
.ico{
  width:var(--icon-lg);
  height:var(--icon-lg);
  flex:none;
  display:block;
  fill:currentColor;
}
.ico-md{width:var(--icon-md);height:var(--icon-md);}

/* ============================================================
   App shell — fills the viewport
   ============================================================ */
.frame{
  width:100%;
  height:100vh;
  height:100dvh;
  background:var(--surface-default);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:stretch;
}

/* ============================================================
   Global navigation (top bar)
   ============================================================ */
.topbar{
  width:100%;
  height:var(--topbar-height);
  flex:none;
  background:var(--surface-default);
  border-bottom:1px solid var(--divider-default);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
}
.icon-btn{
  padding:8px;
  border-radius:var(--radius-lg);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.icon-btn:hover{background:#f2f3f7;}

.org-switch{
  flex:1 1 0;
  min-width:0;
  height:48px;
  display:flex;
  align-items:center;
  gap:12px;
}
.org-btn{
  height:48px;
  padding:8px 12px;
  border-radius:var(--radius-lg);
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.org-btn:hover{background:#f2f3f7;}
.org-avatar{width:32px;height:32px;border-radius:50%;flex:none;display:block;}
.org-name{
  font-size:14px;font-weight:600;line-height:20px;letter-spacing:0;
  color:var(--on-secondary);white-space:nowrap;padding:0 2px;
}

.topbar-actions{display:flex;align-items:center;gap:12px;}
.v-divider{width:1px;height:40px;background:var(--divider-default);flex:none;}

/* ============================================================
   Main
   ============================================================ */
.main{width:100%;flex:1 1 auto;min-height:0;display:flex;align-items:stretch;}

/* ============================================================
   Side navigation (300px)
   ============================================================ */
.sidenav{
  width:var(--sidenav-width);
  flex:none;
  background:var(--surface-default);
  border-right:1px solid var(--secondary-outline-disabled);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  overflow:hidden;
  transition:width .28s var(--ease-soft),transform .28s var(--ease-soft);
}
/* desktop collapse */
.frame.nav-collapsed .sidenav{
  width:0;
  border-right-width:0;
}
.nav-items{
  width:var(--sidenav-width);
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:flex-start;
  gap:4px;
  padding:8px 12px;
}
/* off-canvas scrim (mobile only) */
.scrim{
  position:fixed;
  inset:0;
  background:rgba(23,25,32,.32);
  opacity:0;
  visibility:hidden;
  transition:opacity .26s var(--ease-soft),visibility .26s;
  z-index:40;
  border:0;
  display:block;
  width:100%;
}
.nav-section{width:100%;display:flex;flex-direction:column;gap:4px;}

/* top-level row */
.nav-row{
  width:100%;
  padding:0 4px;
  display:flex;align-items:center;
  position:relative;
}
.nav-row-content{
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;gap:8px;
  padding:8px 4px;
  border-radius:var(--radius-lg);
  overflow:hidden;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.nav-row:hover .nav-row-content{background:#f4f5f9;}
.nav-label{
  flex:1 1 0;min-width:0;
  font-size:12px;font-weight:400;line-height:16px;letter-spacing:0;
  color:inherit;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-row.is-selected .nav-row-content,
.nav-row.is-selected:hover .nav-row-content{
  background:var(--nav-selected-bg);
  color:var(--nav-on-selected);
}
.nav-indicator{
  position:absolute;left:0;top:25%;bottom:25%;
  width:2px;border-radius:24px;background:var(--nav-indicator);
  opacity:0;
  transition:opacity .2s var(--ease-soft);
}
.nav-row.is-selected .nav-indicator{opacity:1;}

/* expandable group */
.nav-group{width:100%;display:flex;flex-direction:column;gap:4px;}
.nav-group-header{
  width:100%;
  display:flex;align-items:center;gap:8px;
  padding:8px;
  border-radius:var(--radius-lg);
  overflow:hidden;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.nav-group-header:hover{background:#f4f5f9;}

.nav-children{
  width:100%;
  display:flex;align-items:stretch;gap:8px;
  padding:0 0 0 16px;
}
.nav-children-rule{width:1px;flex:none;background:var(--divider-default);}
.nav-child-list{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
}
.nav-child{
  position:relative;
  width:100%;
  display:flex;align-items:center;
  padding:8px 4px 8px 12px;   /* 8 + 16 + 8 = 32 row height */
  border-radius:var(--radius-lg);
  transition:background-color .12s ease;
}
.nav-child:hover{background:#f4f5f9;}
/* selected child row — the indicator sits on the divider line, 9px
   left of the row (1px divider + 8px gap) */
.nav-child.is-selected,
.nav-child.is-selected:hover{background:var(--nav-selected-bg);}
.nav-child.is-selected span{color:var(--nav-on-selected);}
.nav-child.is-selected::before{
  content:"";
  position:absolute;
  left:-9px;top:25%;bottom:25%;
  width:2px;border-radius:24px;
  background:var(--nav-indicator);
}
.nav-child span{
  flex:1 1 0;min-width:0;
  font-size:12px;font-weight:400;line-height:16px;letter-spacing:0;
  color:var(--on-secondary);text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-child.view-all span{font-weight:600;color:var(--link-default);}

/* sidebar footer logo */
.sidenav-footer{
  flex:none;width:var(--sidenav-width);
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;
  gap:12px;padding:24px;overflow:hidden;
}

/* Diligent lockup */
.lockup{display:flex;align-items:center;gap:6px;}
.lockup .mark{display:block;flex:none;}
.lockup .word{font-weight:700;color:#232429;line-height:1;letter-spacing:-.2px;}
.lockup--sm .word{font-size:15px;}
.lockup--lg{gap:10px;}
.lockup--lg .word{font-size:26px;letter-spacing:-.4px;}

/* ============================================================
   Content area (1140 × 881)
   ============================================================ */
.content{
  flex:1 1 auto;min-width:0;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  /* Gradient background default — radial, anchored bottom-left.
     Figma: centre (-4, 883.5) in a 1140x881 frame, radii ~781 / ~894,
     stops at 30.527% and 100%.                                       */
  background:radial-gradient(ellipse 68.5% 101.5% at 0% 100%,
      var(--bg-gradient-start) 30.53%,
      var(--bg-gradient-end) 100%);
}
.content-inner{
  flex:1 0 auto;                      /* fills the viewport, then scrolls */
  width:100%;
  max-width:var(--content-max);       /* 980 column + 2 x 80 gutter */
  margin:0 auto;
  padding:0 var(--content-pad) 24px;
  display:flex;
  flex-direction:column;
}
/* welcome + cards share the space above the composer, optically centred */
.stage{
  flex:1 0 auto;                      /* grows, never squashes its content */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:32px;
  padding:32px 0;
}

/* ---- decorative glow behind the composer ----------------------------
   Geometry is 1:1 with Figma (content-area coordinates):
     Ellipse 7  921 x 183 @ (109, 669)  -> centre (569.5, 760.5)
     Ellipse 8  531 x 131 @ (304, 705)  -> centre (569.5, 770.5)
   Focused state scales Ellipse 7 to 729.754 x 145 about the same
   centre = a uniform 0.7924 scale. Ellipse 8 never changes.
   The whole layer is translated by the proximity loop; the input
   itself never moves.                                                  */
.glow-layer{
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  transform:translate3d(var(--glow-x),var(--glow-y),0);
  will-change:transform;
}
.glow{
  position:absolute;
  left:50%;
  top:50%;
  pointer-events:none;
  border-radius:50%;
  transform:translate(-50%,calc(-50% + var(--dy,0px))) scale(var(--s,1));
  transform-origin:50% 50%;
  will-change:transform;
}
.glow-a{
  --s:var(--glow-a-scale);
  width:94%;height:183px;         /* 921/980 of the composer, Figma height */
  background:radial-gradient(closest-side,
      rgba(127,118,236,calc(.30 + .12 * var(--glow-boost))) 0%,
      rgba(127,118,236,calc(.18 + .07 * var(--glow-boost))) 48%,
      rgba(127,118,236,0) 100%);
  filter:blur(52px);
  transition:transform .6s var(--ease-soft);
}
.glow-b{
  --dy:9.5px;                     /* Figma: centre 9.5px below the composer centre */
  width:54.2%;height:131px;       /* 531/980 of the composer */
  background:radial-gradient(closest-side,
      rgba(64,105,254,calc(.24 + .10 * var(--glow-boost))) 0%,
      rgba(64,105,254,calc(.13 + .05 * var(--glow-boost))) 48%,
      rgba(64,105,254,0) 100%);
  filter:blur(46px);
}

/* welcome */
.welcome{
  width:100%;
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.welcome-copy{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  text-align:center;max-width:70ch;
}
.headline{
  margin:0;
  font-size:clamp(20px,1.1rem + 1vw,28px);
  font-weight:400;
  line-height:1.22;
  letter-spacing:0;
  color:var(--type-default);
  text-wrap:balance;
}
.headline b{font-weight:600;}
.subhead{
  margin:0;
  font-size:14px;font-weight:400;line-height:20px;letter-spacing:0;
  color:var(--type-muted);
  text-wrap:pretty;
}

/* suggestion cards */
.card-row{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  /* the elevation lives on the row, not the individual cards */
  filter:
    drop-shadow(-1px 4px 4px var(--elev-low-1))
    drop-shadow(-2px 9px 6px var(--elev-low-2))
    drop-shadow(-12px 38px 12px var(--elev-low-3))
    drop-shadow(-12px 40px 10px var(--elev-low-4));
}
.card{
  min-width:0;
  background:var(--surface-default);
  border:1px solid var(--card-outline);
  border-radius:var(--radius-lg);
  display:flex;flex-direction:column;align-items:flex-start;
  gap:4px;                    /* 16 + 44 + 4 + 24 + 4 + 32 + 16 = 140 */
  padding:16px 20px;
  text-align:left;
  transition:
    border-color .2s var(--ease-soft),
    box-shadow   .24s var(--ease-soft),
    transform    .24s var(--ease-soft);
}
.card:hover{
  border-color:var(--indigo-90);
  transform:translateY(-2px);
  box-shadow:
    0 12px 24px -8px rgba(0,46,159,.11),
    0 3px  8px  -3px rgba(0,46,159,.08);
}
.card:active{
  transform:translateY(-1px);
  transition-duration:.09s;
}
.card-tile{
  width:44px;height:44px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);
  border:1px solid var(--tile-outline);
  background:transparent;
  color:var(--primary-grad-start);
}
/* Gradient primary default, applied to the glyph itself */
.card-tile .ico{fill:url(#grad-primary);}
.card-title{
  margin:0;
  font-size:16px;font-weight:600;line-height:24px;letter-spacing:0;
  color:var(--on-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.card-desc{
  margin:0;
  font-size:12px;font-weight:400;line-height:16px;letter-spacing:0;
  color:var(--type-muted);
}

/* composer */
.chatbox{
  position:relative;
  width:100%;
  flex:none;
  display:flex;flex-direction:column;align-items:center;gap:24px;
  /* scopes the z-indices below so the glow can't reach the siblings */
  isolation:isolate;
}
/* positioning context for the glow + shadow layers.
   isolation:isolate contains the negative z-index children so they
   paint above the content-area background instead of behind it.
   Paint order inside: glow (-2) -> shadow (-1) -> composer (0).   */
.composer-stage{
  position:relative;
  z-index:0;
  width:100%;
  isolation:isolate;
}
.composer{
  position:relative;
  width:100%;
  background:var(--surface-default);
  border:1px solid var(--outline-disabled);
  border-radius:var(--radius-lg);
  display:flex;flex-direction:column;align-items:flex-start;
  /* Semantic/Shadow/Elevation/Low — token radii, not the halved ones
     the generated drop-shadow() emits. Stays STATIC: the offsets are
     large against small blurs, so translating it detaches the shadow's
     own rounded edge from the box. Only the glow moves.              */
  box-shadow:var(--shadow-elevation-low);
  transition:border-color .32s var(--ease-soft);
}
/* proximity — border only, box stays put */
.chatbox.is-near .composer{border-color:var(--outline-highlighted);}
/* focused — takes priority over proximity */
.chatbox.is-focused .composer{border-color:var(--outline-default);}
/* keyboard-only affordance, additive to the Figma spec */
.chatbox.is-focus-visible .composer{
  box-shadow:0 0 0 3px rgba(11,76,206,.28);
}
.composer-input{
  width:100%;
  padding:16px 24px 0 24px;
  display:flex;align-items:center;gap:8px;
}
.composer-input input{
  flex:1 1 0;min-width:0;
  height:20px;
  border:0;outline:0;background:transparent;padding:0;
  font-family:inherit;
  font-size:14px;font-weight:400;line-height:20px;letter-spacing:0;
  color:var(--type-default);
}
.composer-input input::placeholder{color:var(--type-muted);opacity:1;}

.composer-footer{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 16px 12px;   /* 16 + 20 + 24 + 40 + 12 = 112 */
}
.btn-array{display:flex;align-items:center;}
.btn-array.left{gap:0;}     /* attach sits flush against Tools */
.btn-array.right{gap:12px;}
.attach-btn{
  width:32px;height:32px;
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.attach-btn:hover{background:#f2f3f7;}
.tools-btn{
  height:32px;padding:4px 8px;   /* 8+24+36+24+8 = 100 */
  border-radius:var(--radius-lg);
  display:flex;align-items:center;gap:0;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.tools-btn:hover{background:#f2f3f7;}
.tools-btn .label{
  font-size:14px;font-weight:600;line-height:20px;letter-spacing:0;
  color:var(--on-secondary);white-space:nowrap;
}
.round-btn{
  width:40px;height:40px;
  border-radius:var(--radius-lg);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-secondary);
  transition:background-color .12s ease;
}
.round-btn:hover{background:#f2f3f7;}

/* send button — disabled by default, "Gradient primary active" when focused */
.send-btn .ico{width:20px;height:20px;}   /* Button/Medium/Icon size */
.send-btn,.send-btn:hover{
  background:var(--primary-disabled);
  color:var(--on-primary-disabled);
  cursor:default;
  transition:color .28s var(--ease-soft);
}
.send-btn::before{
  content:"";
  position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg,var(--primary-active-start) 0%,var(--primary-active-end) 100%);
  opacity:0;
  transition:opacity .28s var(--ease-soft);
}
.send-btn{position:relative;isolation:isolate;}
.send-btn .ico{position:relative;z-index:1;}
.chatbox.is-focused .send-btn::before,
.chatbox.has-text  .send-btn::before{opacity:1;}
.chatbox.is-focused .send-btn,
.chatbox.has-text  .send-btn{color:var(--on-primary);cursor:pointer;}

/* ---- suggestion chips (New chat view) --------------------------
   Figma "Chip array" 980 x 36, centred, 8px gap.
   Chip = Chip / Outline / Large / Default: white fill, 1px
   Outline/Default border, full pill, 16px effective side padding
   (8 root + 8 label), label Label/Lg 14/20, NO icon, NO shadow.   */
.chip-row{
  display:none;
  position:relative;
  z-index:1;              /* above the glow layer */
  width:100%;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:center;
  gap:8px;
}
.chip{
  height:36px;
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 16px;
  border:1px solid var(--outline-default);
  border-radius:var(--radius-full);
  background:var(--surface-default);
  color:var(--on-secondary);
  white-space:nowrap;
  cursor:pointer;
  transition:
    background-color .16s var(--ease-soft),
    border-color     .16s var(--ease-soft),
    box-shadow       .16s var(--ease-soft);
}
.chip .label{
  font-size:14px;font-weight:400;line-height:20px;letter-spacing:0;
  color:var(--on-secondary);
}
.chip:hover{background:var(--secondary-hover);}
.chip:active{background:var(--secondary-active);transition-duration:.08s;}
/* Semantic/Shadow/Focus/Default — literal hexes, mode-independent */
.chip:focus-visible{
  outline:none;
  box-shadow:0 0 0 1px #ffffff, 0 0 0 4px #0b4cce;
}

.disclaimer{
  margin:0;
  position:relative;
  z-index:1;              /* above the glow layer */
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:400;line-height:16px;letter-spacing:0;
  color:var(--type-muted);white-space:nowrap;
}
.disclaimer a{
  font-weight:600;color:var(--link-default);
  text-decoration:underline;
  text-underline-position:from-font;
  text-decoration-skip-ink:none;
}

/* ============================================================
   Centred views — the welcome + chatbox group sits as one block,
   vertically centred. Figma XDS-5739 confirms exact centring:
     New chat        block 261.5 -> 619.5 in 881  (261.5 / 261.5)
     Incident Resp.  block 209.5 -> 671.5 in 881  (209.5 / 209.5)
   ============================================================ */
.frame.mode-chat .stage,
.frame.mode-incident .stage{flex:0 0 auto;padding:0;}
.frame.mode-chat .chatbox,
.frame.mode-incident .chatbox{margin-top:32px;}
.frame.mode-chat .content-inner::before,
.frame.mode-incident .content-inner::before{content:"";flex:1 0 0;}
.frame.mode-chat .content-inner::after,
.frame.mode-incident .content-inner::after{content:"";flex:1 0 0;}

/* New chat: chips replace the cards */
.frame.mode-chat .card-row{display:none;}
.frame.mode-chat .chip-row{display:flex;}

/* Incident Response: the card row moves inside the chatbox, under the
   composer. 112 + 24 + 140 + 24 + 16 = 316, matching the Figma node. */
.frame.mode-incident .chip-row{display:none;}
.frame.mode-incident .card-row{
  position:relative;
  z-index:1;              /* above the glow layer, like the chips */
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1440px){
  :root{--content-pad:56px;}
}
@media (max-width:1200px){
  :root{--sidenav-width:264px;--content-pad:40px;}
}
@media (max-width:1024px){
  :root{--content-pad:32px;}
  .card-row{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* below 900px the sidebar becomes an off-canvas drawer */
@media (max-width:900px){
  :root{--sidenav-width:288px;--content-pad:24px;}
  .sidenav{
    position:fixed;
    top:var(--topbar-height);
    bottom:0;
    left:0;
    z-index:50;
    transform:translateX(-100%);
    border-right:1px solid var(--secondary-outline-disabled);
    box-shadow:0 12px 32px rgba(0,46,159,.10);
  }
  .frame.nav-open .sidenav{transform:translateX(0);width:var(--sidenav-width);}
  .frame.nav-open .scrim{opacity:1;visibility:visible;}
  .frame.nav-collapsed .sidenav{width:var(--sidenav-width);border-right-width:1px;}
  .topbar{gap:8px;padding:12px 8px;}
  .org-switch{gap:4px;}
  .topbar-actions{gap:4px;}
  .stage{gap:24px;padding:24px 0;}
}

@media (max-width:640px){
  :root{--content-pad:16px;}
  .card-row{gap:12px;}
  .welcome{gap:16px;}
  .lockup--lg .word{font-size:22px;}
  .lockup--lg .mark{width:25px;height:27px;}
  .topbar .v-divider{display:none;}
  .composer-input{padding:12px 16px 0 16px;}
  .composer-footer{padding:12px;}
  .tools-btn .label{display:none;}
  .disclaimer{white-space:normal;text-align:center;padding:0 8px;}
  .glow-a{height:150px;}
  .glow-b{height:110px;}
}

@media (max-width:520px){
  .card-row{grid-template-columns:minmax(0,1fr);}
  .card-title{white-space:normal;}
}

/* short viewports: let the page scroll rather than squash the stage */
@media (max-height:680px){
  .stage{justify-content:flex-start;padding-top:24px;}
}

/* ---- reduced motion: no translation, fade + scale only ---- */
@media (prefers-reduced-motion:reduce){
  .glow-layer{transform:none;will-change:auto;}
  .glow-a{transition:transform .01ms;}
  .composer{transition:border-color .01ms;}
  .send-btn::before,.send-btn{transition:none;}
  .card{transition:border-color .01ms,box-shadow .12s linear;}
  .card:hover,.card:active{transform:none;}
}

/* ---- touch / coarse pointers: no proximity affordance ---- */
@media (hover:none),(pointer:coarse){
  .icon-btn:hover,.org-btn:hover,.nav-row:hover .nav-row-content,
  .nav-group-header:hover,.nav-child:hover,.attach-btn:hover,
  .tools-btn:hover,.round-btn:hover{background:none;}
  .card:hover{
    border-color:var(--secondary-outline-disabled);
    transform:none;
    box-shadow:none;
  }
}
</style>

          <div class="composer-footer">
            <div class="btn-array left">
              <button class="attach-btn" aria-label="Attach file">
                <svg class="ico"><use href="#i-attach-file"/></svg>
              </button>
              <button class="tools-btn">
                <svg class="ico"><use href="#i-tune"/></svg>
                <span class="label">Tools</span>
                <svg class="ico"><use href="#i-expand-more"/></svg>
              </button>
            </div>
            <div class="btn-array right">
              <button class="round-btn" aria-label="Voice input">
                <svg class="ico"><use href="#i-mic"/></svg>
              </button>
              <button class="round-btn send-btn" id="sendBtn" aria-label="Send" disabled>
                <svg class="ico"><use href="#i-arrow-upward"/></svg>
              </button>
            </div>
          </div>
        </div>
       </div><!-- /.composer-stage -->

        <div class="chip-row">
          <button class="chip" type="button"><span class="label">Appoint a director</span></button>
          <button class="chip" type="button"><span class="label">Board resolution</span></button>
          <button class="chip" type="button"><span class="label">Analyze data</span></button>
          <button class="chip" type="button"><span class="label">Summarize</span></button>
        </div>

        <p class="disclaimer">
          AI-generated content may have inaccuracies. <a href="#">Learn more.</a>
        </p>
      </section>
     </div><!-- /.content-inner -->
    </main>

  </div>
</div>

<script>
/* ============================================================
   Composer interaction states
     1. focused          (highest priority)
     2. cursor proximity (within 100px of the composer box)
     3. default
   Only the decorative glow layer moves. The composer never does.
   ============================================================ */
(function () {
  var chatbox  = document.getElementById('chatbox');
  var composer = document.getElementById('composer');
  var content  = document.getElementById('content');
  var input    = document.getElementById('promptInput');
  var sendBtn  = document.getElementById('sendBtn');
  if (!chatbox || !composer || !content || !input) return;

  var PROXIMITY   = 100;      // px — activation radius around the box
  /* Horizontal travel mirrors the cursor proportionally: the glow is
     displaced by the same fraction of its travel that the cursor is
     displaced from the centre of the box, inverted. Expressed as a
     ratio of the composer width so it scales with the layout.        */
  var GLOW_X_RATIO = 0.15;
  var GLOW_X_CAP   = 140;     // px — upper bound on desktop widths
  var MAX_Y        = 12;      // vertical stays gentle
  var FOCUS_SCALE = 0.7924;   // Figma: 729.754 / 921
  var FOCUS_BOOST = 0.35;
  var EASE        = 0.085;    // per-frame interpolation

  var mqReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var mqFine   = window.matchMedia('(hover: hover) and (pointer: fine)');

  var rect = null, raf = 0;
  var focused = false, near = false;
  var px = 0, py = 0, hasPointer = false;
  var tx = 0, ty = 0, tb = 0;   // targets
  var cx = 0, cy = 0, cb = 0;   // current

  function measure() { rect = composer.getBoundingClientRect(); }

  function setNear(v) {
    if (near === v) return;
    near = v;
    chatbox.classList.toggle('is-near', v);
  }

  function write() {
    content.style.setProperty('--glow-x', cx.toFixed(2) + 'px');
    content.style.setProperty('--glow-y', cy.toFixed(2) + 'px');
    content.style.setProperty('--glow-boost', cb.toFixed(3));
  }

  function rest() { tx = 0; ty = 0; }

  function computeTargets() {
    /* focus wins outright — gradient goes static */
    if (focused) { setNear(false); rest(); tb = FOCUS_BOOST; return; }
    if (!mqFine.matches || !hasPointer || !rect) { setNear(false); rest(); tb = 0; return; }

    /* distance to the nearest point on the composer rectangle */
    var nx = Math.max(rect.left, Math.min(px, rect.right));
    var ny = Math.max(rect.top,  Math.min(py, rect.bottom));
    var dx = px - nx, dy = py - ny;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > PROXIMITY) { setNear(false); rest(); tb = 0; return; }
    setNear(true);

    var s = 1 - dist / PROXIMITY;
    var eased = s * s * (3 - 2 * s);            // smoothstep fade-in

    var ccx = rect.left + rect.width  / 2;
    var ccy = rect.top  + rect.height / 2;

    /* ox / oy are the cursor's displacement from the centre of the box,
       normalised to -1..1 across the box plus its proximity margin.    */
    var ox = (px - ccx) / (rect.width  / 2 + PROXIMITY);
    var oy = (py - ccy) / (rect.height / 2 + PROXIMITY);
    ox = Math.max(-1, Math.min(1, ox));
    oy = Math.max(-1, Math.min(1, oy));

    var travelX = Math.min(rect.width * GLOW_X_RATIO, GLOW_X_CAP);

    tx = -ox * travelX * eased;                 /* mirrors the cursor 1:1 */
    ty = -oy * MAX_Y   * eased;
    tb = eased;
  }

  function tick() {
    computeTargets();
    var reduce = mqReduce.matches;
    cx += (tx - cx) * EASE;
    cy += (ty - cy) * EASE;
    cb += (tb - cb) * (reduce ? 0.12 : EASE);
    if (reduce) { cx = 0; cy = 0; }             /* fade only, no motion */
    write();

    var settled = Math.abs(tx - cx) < 0.05 &&
                  Math.abs(ty - cy) < 0.05 &&
                  Math.abs(tb - cb) < 0.002;
    if (settled) { cx = tx; cy = ty; cb = tb; write(); raf = 0; return; }
    raf = requestAnimationFrame(tick);
  }

  function start() { if (!raf) raf = requestAnimationFrame(tick); }

  /* ---- focus ------------------------------------------------ */
  input.addEventListener('focus', function () {
    focused = true;
    chatbox.classList.add('is-focused');
    var kb = false;
    try { kb = input.matches(':focus-visible'); } catch (e) {}
    chatbox.classList.toggle('is-focus-visible', kb);
    content.style.setProperty('--glow-a-scale', String(FOCUS_SCALE));
    start();
  });
  input.addEventListener('blur', function () {
    focused = false;
    chatbox.classList.remove('is-focused', 'is-focus-visible');
    content.style.setProperty('--glow-a-scale', '1');
    start();                                     /* falls back to proximity or default */
  });

  /* ---- typing keeps the send button live -------------------- */
  input.addEventListener('input', function () {
    var has = input.value.trim().length > 0;
    chatbox.classList.toggle('has-text', has);
    if (sendBtn) sendBtn.disabled = !has;
  });

  /* ---- pointer ---------------------------------------------- */
  if (mqFine.matches) {
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      px = e.clientX; py = e.clientY; hasPointer = true;
      start();
    }, { passive: true });

    document.addEventListener('mouseleave', function () {
      hasPointer = false; start();
    });
    window.addEventListener('blur', function () { hasPointer = false; start(); });
  }

  /* touch must never leave the component stuck in a hover state */
  window.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch' || e.pointerType === 'pen') {
      hasPointer = false; setNear(false); start();
    }
  }, { passive: true });

  /* ---- geometry cache --------------------------------------- */
  measure();
  window.addEventListener('resize', function () { measure(); start(); });
  window.addEventListener('scroll', measure, { passive: true });
  content.addEventListener('scroll', measure, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(measure).observe(composer);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  write();
})();

/* ============================================================
   View switching — Home (cards) vs New chat (chips)
   The composer and all of its interaction states are shared;
   only the surrounding content changes.
   ============================================================ */
(function () {
  var frame      = document.getElementById('frame');
  var input      = document.getElementById('promptInput');
  var chatbox    = document.getElementById('chatbox');
  var stage      = document.querySelector('.stage');
  var cardRow    = document.querySelector('.card-row');
  var disclaimer = chatbox ? chatbox.querySelector('.disclaimer') : null;
  var rows       = document.querySelectorAll('[data-view]');
  if (!frame || !rows.length) return;

  /* The card row is a single element that lives in one of two places:
     above the composer (Home) or inside the chatbox below it
     (Incident Response). Moving it beats duplicating the markup.   */
  function placeCards(view) {
    if (!cardRow || !stage || !chatbox) return;
    if (view === 'incident') {
      if (cardRow.parentNode !== chatbox) chatbox.insertBefore(cardRow, disclaimer);
    } else if (cardRow.parentNode !== stage) {
      stage.appendChild(cardRow);
    }
  }

  function setView(view) {
    frame.classList.toggle('mode-chat', view === 'chat');
    frame.classList.toggle('mode-incident', view === 'incident');
    placeCards(view);
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].getAttribute('data-view') === view;
      rows[i].classList.toggle('is-selected', on);
      if (on) rows[i].setAttribute('aria-current', 'page');
      else rows[i].removeAttribute('aria-current');
    }
    /* the composer has moved — let the proximity loop re-measure */
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  for (var i = 0; i < rows.length; i++) {
    (function (row) {
      row.addEventListener('click', function () {
        var view = row.getAttribute('data-view');
        setView(view);
        if (view === 'chat' && input) input.focus();
      });
    })(rows[i]);
  }

  /* chips seed the prompt */
  var chips = document.querySelectorAll('.chip');
  for (var j = 0; j < chips.length; j++) {
    (function (chip) {
      chip.addEventListener('click', function () {
        if (!input) return;
        var label = chip.querySelector('.label');
        input.value = label ? label.textContent.trim() : '';
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.focus();
      });
    })(chips[j]);
  }
})();

/* ============================================================
   Side navigation — collapse on desktop, drawer on small screens
   ============================================================ */
(function () {
  var frame  = document.getElementById('frame');
  var toggle = document.getElementById('navToggle');
  var scrim  = document.getElementById('scrim');
  var nav    = document.getElementById('sidenav');
  if (!frame || !toggle || !nav) return;

  var mqDrawer = window.matchMedia('(max-width: 900px)');

  function isOpen() {
    return mqDrawer.matches
      ? frame.classList.contains('nav-open')
      : !frame.classList.contains('nav-collapsed');
  }

  var supportsInert = 'inert' in HTMLElement.prototype;

  function sync() {
    var open = isOpen();
    toggle.setAttribute('aria-expanded', String(open));
    /* a hidden sidebar must not be reachable by keyboard. `inert` also
       conveys aria-hidden, without the "focusable inside aria-hidden"
       violation that a bare aria-hidden would create. */
    if (supportsInert) {
      nav.inert = !open;
      nav.removeAttribute('aria-hidden');
    } else if (open) {
      nav.removeAttribute('aria-hidden');
    } else {
      nav.setAttribute('aria-hidden', 'true');
    }
  }

  function close() {
    frame.classList.remove('nav-open');
    if (!mqDrawer.matches) frame.classList.add('nav-collapsed');
    sync();
  }

  toggle.addEventListener('click', function () {
    if (mqDrawer.matches) {
      frame.classList.toggle('nav-open');
    } else {
      frame.classList.toggle('nav-collapsed');
    }
    sync();
  });

  if (scrim) scrim.addEventListener('click', function () {
    frame.classList.remove('nav-open');
    sync();
    toggle.focus();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && frame.classList.contains('nav-open')) {
      frame.classList.remove('nav-open');
      sync();
      toggle.focus();
    }
  });

  /* closing the drawer when a nav item is chosen */
  nav.addEventListener('click', function (e) {
    if (mqDrawer.matches && e.target.closest('button')) {
      frame.classList.remove('nav-open');
      sync();
    }
  });

  function onBreakpoint() {
    frame.classList.remove('nav-open');
    if (mqDrawer.matches) frame.classList.remove('nav-collapsed');
    sync();
  }
  if (mqDrawer.addEventListener) mqDrawer.addEventListener('change', onBreakpoint);
  else if (mqDrawer.addListener) mqDrawer.addListener(onBreakpoint);

  onBreakpoint();
})();
</script>

</body>
</html>
